services:
  db:
    image: postgres:16-alpine
    container_name: nofa_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nofa_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgrespassword}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-nofa_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nofa_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nofa_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-nofa_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - SECRET_KEY=${SECRET_KEY:-nofa-production-secret-key-at-least-32-chars-long-dokploy}
      - CORS_ORIGINS=${CORS_ORIGINS:-["*"]}
      - STORAGE_PROVIDER=local
      - FIRST_SUPERADMIN_EMAIL=${FIRST_SUPERADMIN_EMAIL:-superadmin@platform.com}
      - FIRST_SUPERADMIN_PASSWORD=${FIRST_SUPERADMIN_PASSWORD:-SuperAdmin@123456}
      - FIRST_SUPERADMIN_NAME=${FIRST_SUPERADMIN_NAME:-Super Administrator}
      - AUTO_SEED_DEMO=${AUTO_SEED_DEMO:-true}
    volumes:
      - media_storage:/app/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nofa_celery_worker
    restart: always
    command: celery -A app.tasks.celery_app worker --loglevel=info
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgrespassword}@db:5432/${POSTGRES_DB:-nofa_db}
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_PLATFORM_DOMAIN: ${PLATFORM_DOMAIN:-localhost:3000}
        NEXT_PUBLIC_DEFAULT_TENANT_SLUG: ${DEFAULT_TENANT_SLUG:-nofa-beauty-center}
    container_name: nofa_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_PLATFORM_DOMAIN=${PLATFORM_DOMAIN:-localhost:3000}
      - NEXT_PUBLIC_DEFAULT_TENANT_SLUG=${DEFAULT_TENANT_SLUG:-nofa-beauty-center}
    depends_on:
      - backend

  company_admin:
    build:
      context: ./company-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${COMPANY_ADMIN_NAME:-Nofa Business Manager}
    container_name: nofa_company_admin
    restart: always
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_NAME=${COMPANY_ADMIN_NAME:-Nofa Business Manager}
    depends_on:
      - backend

  super_admin:
    build:
      context: ./super-admin
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${PUBLIC_API_URL:-http://localhost:8000/api/v1}
        NEXT_PUBLIC_APP_NAME: ${SUPER_ADMIN_NAME:-Nofa SaaS Console}
    container_name: nofa_super_admin
    restart: always
    ports:
      - "3002:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_BASE_URL=${PUBLIC_API_URL:-http://localhost:8000/api/v1}
      - NEXT_PUBLIC_APP_NAME=${SUPER_ADMIN_NAME:-Nofa SaaS Console}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  media_storage:
